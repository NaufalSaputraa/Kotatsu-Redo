name: Build and Release APK

on:
  push:
    branches:
      - devel
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Kotatsu
        uses: actions/checkout@v4
        with:
          path: Kotatsu

      - name: Checkout Parsers
        uses: actions/checkout@v4
        with:
          repository: naansa-naufalsaputra/kotatsu-parsers-redo
          path: kotatsu-parsers-redo

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x Kotatsu/gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/kotatsu-release.jks

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/kotatsu-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd Kotatsu
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv Kotatsu/app/build/outputs/apk/release/app-release.apk Kotatsu/app/build/outputs/apk/release/Kotatsu-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Release Build #${{ github.run_number }}"
          body: |
            Automated release build from commit ${{ github.sha }}
            
            This release contains the latest changes to the app and the custom parser.
          draft: false
          prerelease: false
          files: Kotatsu/app/build/outputs/apk/release/Kotatsu-release.apk
