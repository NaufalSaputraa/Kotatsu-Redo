name: Build and Release Debug APK

on:
  push:
    branches:
      - devel
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Kotatsu
        uses: actions/checkout@v4
        with:
          path: Kotatsu

      - name: Checkout Parsers
        uses: actions/checkout@v4
        with:
          repository: naansa-naufalsaputra/kotatsu-parsers-redo
          path: kotatsu-parsers-redo

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x Kotatsu/gradlew

      - name: Build Debug APK
        run: |
          cd Kotatsu
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv Kotatsu/app/build/outputs/apk/debug/app-debug.apk Kotatsu/app/build/outputs/apk/debug/Kotatsu-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: "Debug Build #${{ github.run_number }}"
          body: |
            Automated debug build from commit ${{ github.sha }}
            
            This release contains the latest changes to the app and the custom parser.
          draft: false
          prerelease: false
          files: Kotatsu/app/build/outputs/apk/debug/Kotatsu-debug.apk
